name: CI

on:
  pull_request:
    branches:
    - "**"
  push:
    branches:
    - master
    tags:
    - "*.*.*"
    - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.12.2
        args: --timeout=10m

  test-coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Run tests with coverage
      run: go test -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: coverage.out
        token: ${{ secrets.CODECOV_TOKEN }}

  govulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Run govulncheck
      uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
      with:
        go-package: ./...
        repo-checkout: false

  release:
    name: Release binaries
    runs-on: ubuntu-latest
    needs: [lint, test-coverage, govulncheck]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.actor == 'nektos/act'
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Release binaries
      if: github.actor != 'nektos/act'
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        distribution: goreleaser
        version: "~> v2"
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    name: Build ${{ matrix.arch }} image
    runs-on: ubuntu-latest
    needs: release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.actor == 'nektos/act'
    timeout-minutes: 20
    strategy:
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    # Build the image binary from the checked-out source so the published image
    # always matches this commit, instead of re-downloading a release asset that
    # could drift from the tagged SHA.
    - name: Build release binary from source
      run: |
        mkdir -p dist
        CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
          go build -trimpath -ldflags="-s -w" \
          -o "dist/k8s-mongo-labeler-sidecar-linux-${{ matrix.arch }}" ./

    - name: Set up QEMU
      if: matrix.arch != 'amd64'
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Log in to GitHub Container Registry
      if: github.actor != 'nektos/act'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set integration image ref
      id: image
      run: |
        if [[ "${GITHUB_ACTOR}" == "nektos/act" ]]; then
          echo "image_ref=mongo-labeler:ci-local" >> "$GITHUB_OUTPUT"
        else
          echo "image_ref=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}-amd64" >> "$GITHUB_OUTPUT"
        fi

    - name: Extract Docker metadata
      if: github.actor != 'nektos/act'
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=tag,suffix=-${{ matrix.arch }}
          type=sha,prefix=sha-,format=long,suffix=-${{ matrix.arch }}
        annotations: |
          org.opencontainers.image.description=Kubernetes sidecar that detects MongoDB replica set primary and labels the pod with primary=true for service selection.

    - name: Build Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: ./Dockerfile.dist
        platforms: linux/${{ matrix.arch }}
        push: ${{ github.actor != 'nektos/act' }}
        load: ${{ github.actor == 'nektos/act' && matrix.arch == 'amd64' }}
        tags: ${{ github.actor == 'nektos/act' && steps.image.outputs.image_ref || steps.meta.outputs.tags }}
        labels: ${{ github.actor != 'nektos/act' && steps.meta.outputs.labels || '' }}
        annotations: ${{ github.actor != 'nektos/act' && steps.meta.outputs.annotations || '' }}

  manifest:
    name: Create manifest list
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 10
    permissions:
      packages: write

    steps:
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create manifest lists
      run: |
        IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
        SHA="sha-${GITHUB_SHA}"
        TAG="${GITHUB_REF#refs/tags/}"

        # Create :sha-<commit> manifest
        docker buildx imagetools create -t "${IMAGE}:${SHA}" \
          "${IMAGE}:${SHA}-amd64" "${IMAGE}:${SHA}-arm64"

        # Create :<tag> manifest
        docker buildx imagetools create -t "${IMAGE}:${TAG}" \
          "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"

  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    needs: build-and-push
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.actor == 'nektos/act'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Log in to GitHub Container Registry
      if: github.actor != 'nektos/act'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull CI image
      if: github.actor != 'nektos/act'
      run: docker pull "${{ needs.build-and-push.outputs.image_ref }}"

    - name: Set up kubectl
      uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

    - name: Set up kind
      uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      with:
        cluster_name: kind-mongo-labeler
        version: v0.32.0
        install_only: true

    - name: Run integration test
      env:
        LABELER_IMAGE: ${{ needs.build-and-push.outputs.image_ref }}
        USE_PREBUILT_IMAGE: "true"
      run: ./test/integration/run.sh
