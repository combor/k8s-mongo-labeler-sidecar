name: CI

on:
  pull_request:
    branches:
    - "**"
  push:
    branches:
    - master
    tags:
    - "*.*.*"
    - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        # Tag builds publish artifacts, so they never restore a shared cache.
        cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: v2.15.0
        args: --timeout=10m

  test-coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        # Tag builds publish artifacts, so they never restore a shared cache.
        cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

    - name: Run tests with coverage
      run: go test -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload to Codecov
      uses: codecov/codecov-action@v7.1.1
      with:
        files: coverage.out
        token: ${{ secrets.CODECOV_TOKEN }}

  govulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        # Tag builds publish artifacts, so they never restore a shared cache.
        cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

    - name: Run govulncheck
      uses: golang/govulncheck-action@v1.1.0
      with:
        go-package: ./...
        repo-checkout: false

  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream. After changing any
  # `uses:` line, run `gh actions-lock` and commit the updated lockfile.
  lockfile:
    name: Verify actions lockfile
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Install gh-actions-lock
      run: gh extension install github/gh-actions-lock --pin v0.4.1

    - name: Verify lockfile
      run: gh actions-lock --verify

  zizmor:
    name: Workflow security lint
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Run zizmor
      uses: zizmorcore/zizmor-action@v0.8.1
      with:
        version: v1.32.0
        advanced-security: false

  release:
    name: Release binaries
    runs-on: ubuntu-latest
    needs: [lint, test-coverage, govulncheck, integration-test]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.actor == 'nektos/act'
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        # Never restore a shared cache into a job that publishes artifacts.
        cache: false

    - name: Release binaries
      if: github.actor != 'nektos/act'
      uses: goreleaser/goreleaser-action@v7.3.0
      with:
        distribution: goreleaser
        version: "~> v2"
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    name: Build ${{ matrix.arch }} image
    runs-on: ubuntu-latest
    needs: release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.actor == 'nektos/act'
    timeout-minutes: 20
    strategy:
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        # Never restore a shared cache into a job that publishes artifacts.
        cache: false

    # Build the image binary from the checked-out source so the published image
    # always matches this commit, instead of re-downloading a release asset that
    # could drift from the tagged SHA.
    - name: Build release binary from source
      run: |
        mkdir -p dist
        CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
          go build -trimpath -ldflags="-s -w" \
          -o "dist/k8s-mongo-labeler-sidecar-linux-${{ matrix.arch }}" ./

    - name: Set up QEMU
      if: matrix.arch != 'amd64'
      uses: docker/setup-qemu-action@v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Log in to GitHub Container Registry
      if: github.actor != 'nektos/act'
      uses: docker/login-action@v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # act cannot push, so it tags the image locally instead of using the
    # registry metadata below.
    - name: Set local image ref for act
      if: github.actor == 'nektos/act'
      id: image
      run: echo "image_ref=mongo-labeler:ci-local" >> "$GITHUB_OUTPUT"

    - name: Extract Docker metadata
      if: github.actor != 'nektos/act'
      id: meta
      uses: docker/metadata-action@v6.2.0
      with:
        images: ghcr.io/${{ github.repository }}
        # The manifest job tags latest on the multi-arch image. Left on, each
        # single-arch push here would move latest to whichever arch finished last.
        flavor: latest=false
        tags: |
          type=ref,event=tag,suffix=-${{ matrix.arch }}
          type=sha,prefix=sha-,format=long,suffix=-${{ matrix.arch }}
        annotations: |
          org.opencontainers.image.description=Kubernetes sidecar that detects MongoDB replica set primary and labels the pod with primary=true for service selection.

    - name: Build Docker image
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        file: ./Dockerfile.dist
        platforms: linux/${{ matrix.arch }}
        push: ${{ github.actor != 'nektos/act' }}
        load: ${{ github.actor == 'nektos/act' && matrix.arch == 'amd64' }}
        tags: ${{ github.actor == 'nektos/act' && steps.image.outputs.image_ref || steps.meta.outputs.tags }}
        labels: ${{ github.actor != 'nektos/act' && steps.meta.outputs.labels || '' }}
        annotations: ${{ github.actor != 'nektos/act' && steps.meta.outputs.annotations || '' }}

  manifest:
    name: Create manifest list
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 10
    permissions:
      packages: write
      # Sign the image's build provenance with GitHub's attestation service.
      id-token: write
      attestations: write

    steps:
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create manifest lists
      id: build
      run: |
        IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
        SHA="sha-${GITHUB_SHA}"
        TAG="${GITHUB_REF#refs/tags/}"

        # Create :sha-<commit> manifest
        docker buildx imagetools create -t "${IMAGE}:${SHA}" \
          "${IMAGE}:${SHA}-amd64" "${IMAGE}:${SHA}-arm64"

        # Create :<tag> manifest, and move latest to it unless the tag is a
        # prerelease such as 0.9.0-rc1.
        tags=(-t "${IMAGE}:${TAG}")
        [[ "$TAG" == *-* ]] || tags+=(-t "${IMAGE}:latest")
        docker buildx imagetools create "${tags[@]}" \
          "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"

        digest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)
        echo "digest=${digest}" >> "$GITHUB_OUTPUT"

    # Anyone can check where the image came from with:
    #   gh attestation verify oci://ghcr.io/combor/k8s-mongo-labeler-sidecar:TAG -R combor/k8s-mongo-labeler-sidecar
    - name: Attest the image
      uses: actions/attest@v4.2.2
      with:
        subject-name: ghcr.io/combor/k8s-mongo-labeler-sidecar
        subject-digest: ${{ steps.build.outputs.digest }}

  integration-test:
    name: Integration test (${{ matrix.auth }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        auth: [none, env, uri, invalid]
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Set up kubectl
      uses: azure/setup-kubectl@v5.2.0

    - name: Set up kind
      uses: helm/kind-action@v1.15.2
      with:
        version: v0.33.0
        install_only: true

    - name: Run integration test
      env:
        MONGO_AUTH_MODE: ${{ matrix.auth }}
        CLUSTER_NAME: mongo-labeler-${{ github.run_id }}-${{ strategy.job-index }}
        KUBECONFIG: ${{ runner.temp }}/mongo-labeler-${{ strategy.job-index }}.kubeconfig
        LABELER_IMAGE: mongo-labeler:ci-${{ github.run_id }}-${{ strategy.job-index }}
        USE_PREBUILT_IMAGE: "false"
      run: ./test/integration/run.sh
