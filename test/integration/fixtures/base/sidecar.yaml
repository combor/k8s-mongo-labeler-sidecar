apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  # The runner selects the local image and optional settings before scaling up.
  replicas: 0
  template:
    spec:
      containers:
      - name: labeler
        image: mongo-labeler:local
        imagePullPolicy: Never
        env:
        - name: DEBUG
          value: "true"
        - name: MONGODB_LOG_ALL
          value: debug
